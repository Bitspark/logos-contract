name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing immutable contract release tag (vX.Y.Z)'
        type: string
        required: true
      operation:
        description: 'Publish with trusted identities, prepare archives for native bootstrap, or consume a published release'
        type: choice
        options: [publish, prepare, consume]
        default: publish
permissions:
  contents: read
concurrency:
  group: contract-release
  cancel-in-progress: false
jobs:
  test:
    if: ${{ inputs.operation != 'consume' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.version }}
          persist-credentials: false
          fetch-depth: 0
      - name: Require this workflow to run at the requested release
        env:
          RELEASE: ${{ inputs.version }}
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ "$OPERATION" = publish ]; then test "$GITHUB_REF" = "refs/tags/$RELEASE"; fi
          source="$(git rev-parse HEAD)"
          test "$(git rev-parse "$RELEASE^{commit}")" = "$source"
          test "$(git rev-parse "contract/go/$RELEASE^{commit}")" = "$source"
          echo "Release source: $source ($RELEASE)"
          python3 - "$RELEASE" <<'PY'
          import json, sys, tomllib
          version = sys.argv[1][1:]
          assert json.load(open('contract/ts/package.json'))['version'] == version
          assert tomllib.load(open('contract/rs/Cargo.toml', 'rb'))['package']['version'] == version
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: bash scripts/check.sh
      - name: Prepare already verified packages for upload without local build work
        if: ${{ inputs.operation == 'prepare' }}
        env:
          RELEASE: ${{ inputs.version }}
          NPM_CONFIG_PROVENANCE: 'false'
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/registry-packages"
          mkdir "$destination"
          (cd contract/ts && npm pack --ignore-scripts --pack-destination "$destination")
          cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/package-metadata.json"
          python3 - "$RELEASE" "$RUNNER_TEMP/package-metadata.json" "$destination" <<'PY'
          import json, pathlib, shutil, struct, sys, tarfile
          version, metadata_path, destination = sys.argv[1][1:], pathlib.Path(sys.argv[2]), pathlib.Path(sys.argv[3])
          packages = json.loads(metadata_path.read_text())['packages']
          package, = [p for p in packages if p['name'] == 'logos-contract']
          assert package['version'] == version
          crate = pathlib.Path('target/package') / f'logos-contract-{version}.crate'
          archive = crate.read_bytes()
          # Cargo's documented registry upload protocol, including renamed dependencies:
          # https://doc.rust-lang.org/cargo/reference/registry-web-api.html#publish
          deps = []
          for dep in package['dependencies']:
              assert dep['source'] == 'registry+https://github.com/rust-lang/crates.io-index', dep['name']
              assert not dep.get('path'), dep['name']
              deps.append(dict(name=dep['name'], version_req=dep['req'], features=dep['features'],
                               optional=dep['optional'], default_features=dep['uses_default_features'],
                               target=dep['target'], kind=dep['kind'] or 'normal', registry=dep.get('registry'),
                               explicit_name_in_toml=dep['rename']))
          metadata = {k: package.get(k) for k in ('authors', 'description', 'documentation', 'homepage',
                      'keywords', 'categories', 'license', 'license_file', 'repository', 'links', 'rust_version')}
          metadata.update(name=package['name'], vers=version, deps=deps, features=package['features'],
                          readme=None, readme_file=package['readme'], badges={})
          if package['readme']:
              with tarfile.open(crate) as source:
                  metadata['readme'] = source.extractfile(f'logos-contract-{version}/{package["readme"]}').read().decode()
          encoded = json.dumps(metadata, separators=(',', ':')).encode()
          (destination / 'cargo-upload.bin').write_bytes(struct.pack('<I', len(encoded)) + encoded +
                                                        struct.pack('<I', len(archive)) + archive)
          (destination / 'cargo-upload.json').write_text(json.dumps(metadata, indent=2) + '\n')
          shutil.copyfile(crate, destination / crate.name)
          PY
          mkdir "$RUNNER_TEMP/archive-consumer"
          cd "$RUNNER_TEMP/archive-consumer"
          npm install --ignore-scripts --no-audit --no-fund "$destination/bitspark-logos-contract-${RELEASE#v}.tgz"
          node --input-type=module -e 'import assert from "node:assert/strict"; import * as logos from "@bitspark/logos-contract"; assert.equal(typeof logos.check, "function");'
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.operation == 'prepare' }}
        with:
          name: registry-packages-${{ inputs.version }}
          path: ${{ runner.temp }}/registry-packages/
          if-no-files-found: error
          retention-days: 7
  npm:
    needs: test
    if: ${{ inputs.operation == 'publish' }}
    runs-on: ubuntu-24.04
    environment: npm
    env:
      NPM_CONFIG_PROVENANCE: 'false'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Build the contract
        working-directory: contract/ts
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Publish with the trusted identity
        working-directory: contract/ts
        run: npm publish --access public
  cargo:
    needs: test
    if: ${{ inputs.operation == 'publish' }}
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: '1.98.1'
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the contract
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p logos-contract --locked
  consume:
    needs: [npm, cargo]
    if: ${{ always() && (inputs.operation == 'consume' || (needs.npm.result == 'success' && needs.cargo.result == 'success')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: '1.98.1'
      - name: Consume the published packages without credentials or replacements
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE#v}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          export GOPROXY=https://proxy.golang.org,direct GOSUMDB=sum.golang.org
          export GOPRIVATE='' GONOPROXY='' GONOSUMDB='' GOWORK=off
          export NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN CARGO_REGISTRY_TOKEN
          mkdir -p "$RUNNER_TEMP/consumer/src"
          cd "$RUNNER_TEMP/consumer"
          npm install --ignore-scripts --no-audit --no-fund "@bitspark/logos-contract@$version"
          node --input-type=module -e 'import assert from "node:assert/strict"; import * as logos from "@bitspark/logos-contract"; assert.equal(typeof logos.check, "function");'
          printf '[package]\nname = "public-contract-consumer"\nversion = "0.0.0"\nedition = "2021"\n[dependencies]\nlogos-contract = "=%s"\n' "$version" > Cargo.toml
          printf 'use logos_contract as _;\nfn main() {}\n' > src/main.rs
          cargo build
          go mod init public-consumer.invalid/logos
          go get "github.com/Bitspark/logos-contract/contract/go@$RELEASE"
          go mod download -json "github.com/Bitspark/logos-contract/contract/go@$RELEASE"
          printf 'package main\nimport _ "github.com/Bitspark/logos-contract/contract/go"\nfunc main() {}\n' > main.go
          go build .
