name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing immutable contract release tag (vX.Y.Z)'
        type: string
        required: true
      bootstrap:
        description: 'First 0.24.0 publication using temporary registry bootstrap credentials'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: contract-release
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require this workflow to run at the requested release
        env:
          RELEASE: ${{ inputs.version }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE"
          if [ "$BOOTSTRAP" = true ]; then test "$RELEASE" = v0.24.0; fi
          test "$(git rev-parse "$RELEASE^{commit}")" = "$GITHUB_SHA"
          test "$(git rev-parse "contract/go/$RELEASE^{commit}")" = "$GITHUB_SHA"
          python3 - "$RELEASE" <<'PY'
          import json, sys, tomllib
          version = sys.argv[1][1:]
          assert json.load(open('contract/ts/package.json'))['version'] == version
          assert tomllib.load(open('contract/rs/Cargo.toml', 'rb'))['package']['version'] == version
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - run: bash scripts/check.sh
  npm:
    needs: test
    runs-on: ubuntu-24.04
    environment: npm
    env:
      NPM_CONFIG_PROVENANCE: 'false'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Build the contract
        working-directory: contract/ts
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Publish with the trusted identity
        if: ${{ !inputs.bootstrap }}
        working-directory: contract/ts
        run: npm publish --access public
      - name: Create the initial package with temporary bootstrap access
        if: ${{ inputs.bootstrap }}
        working-directory: contract/ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm publish --access public
  cargo:
    needs: test
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: '1.98.1'
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: ${{ !inputs.bootstrap }}
      - name: Publish the contract
        if: ${{ !inputs.bootstrap }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p logos-contract --locked
      - name: Create the initial crate with temporary bootstrap access
        if: ${{ inputs.bootstrap }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo publish -p logos-contract --locked
  consume:
    needs: [npm, cargo]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - uses: dtolnay/rust-toolchain@18f0487477426dce244608110aa2660c2893deb7 # 1.98.1
        with:
          toolchain: '1.98.1'
      - name: Consume the published packages without credentials or replacements
        env:
          RELEASE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RELEASE#v}"
          export GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0
          export GOPROXY=https://proxy.golang.org,direct GOSUMDB=sum.golang.org
          export GOPRIVATE='' GONOPROXY='' GONOSUMDB='' GOWORK=off
          export NPM_CONFIG_USERCONFIG=/dev/null NPM_CONFIG_REGISTRY=https://registry.npmjs.org
          unset GH_TOKEN GITHUB_TOKEN NODE_AUTH_TOKEN NPM_TOKEN CARGO_REGISTRY_TOKEN
          mkdir -p "$RUNNER_TEMP/consumer/src"
          cd "$RUNNER_TEMP/consumer"
          npm install --ignore-scripts --no-audit --no-fund "@bitspark/logos-contract@$version"
          node --input-type=module -e 'import assert from "node:assert/strict"; import * as logos from "@bitspark/logos-contract"; assert.equal(typeof logos.check, "function");'
          printf '[package]\nname = "public-contract-consumer"\nversion = "0.0.0"\nedition = "2021"\n[dependencies]\nlogos-contract = "=%s"\n' "$version" > Cargo.toml
          printf 'use logos_contract as _;\nfn main() {}\n' > src/main.rs
          cargo build
          go mod init public-consumer.invalid/logos
          go get "github.com/Bitspark/logos-contract/contract/go@$RELEASE"
          go mod download -json "github.com/Bitspark/logos-contract/contract/go@$RELEASE"
          printf 'package main\nimport _ "github.com/Bitspark/logos-contract/contract/go"\nfunc main() {}\n' > main.go
          go build .
